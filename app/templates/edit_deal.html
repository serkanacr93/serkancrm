{% extends "base.html" %}

{% block title %}Fırsat Düzenle - CRM Sistemi{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-pencil"></i> Fırsat Düzenle</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Teklif No</label>
                    <input type="text" class="form-control" value="{{ deal.display_no }}" readonly>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Müşteri</label>
                    <input type="text" class="form-control" value="{{ deal.title }}" readonly>
                    <small class="text-muted">Teklif adı müşterinin adından otomatik oluşur, değiştirilemez.</small>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label for="value" class="form-label">Toplam Değer (₺) *</label>
                    <input type="number" class="form-control" id="value" name="value" value="{{ deal.value }}" min="0" step="0.01" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="stage" class="form-label">Aşama</label>
                    <select class="form-select" id="stage" name="stage">
                        <option value="yeni" {{ 'selected' if deal.stage == 'yeni' }}>Yeni</option>
                        <option value="iletisim" {{ 'selected' if deal.stage == 'iletisim' }}>İletişim</option>
                        <option value="teklif" {{ 'selected' if deal.stage == 'teklif' }}>Teklif</option>
                        <option value="muzakere" {{ 'selected' if deal.stage == 'muzakere' }}>Müzakere</option>
                        <option value="kazanilan" {{ 'selected' if deal.stage == 'kazanilan' }}>Kazanılan</option>
                        <option value="kaybedilen" {{ 'selected' if deal.stage == 'kaybedilen' }}>Kaybedilen</option>
                        <option value="revize" {{ 'selected' if deal.stage == 'revize' }}>Revize</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="expected_close" class="form-label">Beklenen Kapanış</label>
                    <input type="date" class="form-control" id="expected_close" name="expected_close" value="{{ deal.expected_close.strftime('%Y-%m-%d') if deal.expected_close else '' }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label for="valid_until" class="form-label">Geçerlilik Tarihi</label>
                    <input type="date" class="form-control" id="valid_until" name="valid_until" value="{{ deal.valid_until.strftime('%Y-%m-%d') if deal.valid_until else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label for="para_birimi" class="form-label">Para Birimi</label>
                    <select class="form-select" id="para_birimi" name="para_birimi">
                        <option value="TRY" {{ 'selected' if deal.para_birimi == 'TRY' }}>₺ TRY</option>
                        <option value="EUR" {{ 'selected' if deal.para_birimi == 'EUR' }}>€ EUR</option>
                        <option value="USD" {{ 'selected' if deal.para_birimi == 'USD' }}>$ USD</option>
                    </select>
                </div>
                <div class="col-md-5 mb-3" id="kullanilan_kur_box" style="{{ '' if deal.para_birimi != 'TRY' else 'display:none;' }}">
                    <label for="kullanilan_kur" class="form-label">Kullanılan Kur (1 birim = ? ₺)</label>
                    <div class="input-group">
                        <input type="number" step="0.0001" min="0" class="form-control" id="kullanilan_kur" name="kullanilan_kur" value="{{ deal.kullanilan_kur or '' }}">
                        <button type="button" class="btn btn-outline-secondary" id="tcmb_fetch_btn">
                            <i class="bi bi-arrow-repeat"></i> TCMB'den Çek
                        </button>
                    </div>
                    <div class="form-text" id="tcmb_kur_info"></div>
                </div>
            </div>

            <h6 class="text-muted mt-2"><i class="bi bi-cash-coin"></i> Ödeme Şekli</h6>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="vade_gun" class="form-label">Vade (Gün)</label>
                    <input type="text" class="form-control" id="vade_gun" name="vade_gun" value="{{ deal.vade_gun or '' }}" placeholder="Örn: 30 gün">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="pesinat" class="form-label">Peşinat</label>
                    <input type="text" class="form-control" id="pesinat" name="pesinat" value="{{ deal.pesinat or '' }}" placeholder="Örn: %30 peşin">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="bakiye_odemesi" class="form-label">Bakiye Ödemesi</label>
                    <input type="text" class="form-control" id="bakiye_odemesi" name="bakiye_odemesi" value="{{ deal.bakiye_odemesi or '' }}" placeholder="Örn: Teslimde nakit">
                </div>
            </div>

            <h5 class="mt-4 mb-3"><i class="bi bi-box"></i> Ürün / Hizmet Detayları</h5>
            <div id="items-container">
                {% for item in deal.items %}
                <div class="row mb-2 item-row">
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="desc_{{ loop.index0 }}" value="{{ item.description }}" placeholder="Açıklama" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control" name="qty_{{ loop.index0 }}" value="{{ item.quantity }}" placeholder="Miktar" min="0" step="0.01" required>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="unit_{{ loop.index0 }}">
                            <option value="adet" {{ 'selected' if item.unit == 'adet' }}>Adet</option>
                            <option value="kg" {{ 'selected' if item.unit == 'kg' }}>Kg</option>
                            <option value="mt" {{ 'selected' if item.unit == 'mt' }}>Metre</option>
                            <option value="lt" {{ 'selected' if item.unit == 'lt' }}>Litre</option>
                            <option value="m2" {{ 'selected' if item.unit == 'm2' }}>m²</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control" name="price_{{ loop.index0 }}" value="{{ item.unit_price }}" placeholder="Birim Fiyat (₺)" min="0" step="0.01" required>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="urun_tipi_{{ loop.index0 }}" title="Üretim: kendi atölyemizde üretilir. Ticaret: hazır alınıp satılır.">
                            <option value="uretim" {{ 'selected' if item.urun_tipi == 'uretim' }}>Üretim</option>
                            <option value="ticaret" {{ 'selected' if item.urun_tipi == 'ticaret' }}>Ticaret</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-danger btn-sm remove-item"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
                <div class="row mb-2 g-1 item-specs-row">
                    <div class="col"><input type="text" class="form-control form-control-sm" name="kagit_cinsi_{{ loop.index0 }}" value="{{ item.kagit_cinsi or '' }}" placeholder="Kağıt Cinsi"></div>
                    <div class="col"><input type="text" class="form-control form-control-sm" name="boy_{{ loop.index0 }}" value="{{ item.boy or '' }}" placeholder="Boy"></div>
                    <div class="col"><input type="text" class="form-control form-control-sm" name="en_{{ loop.index0 }}" value="{{ item.en or '' }}" placeholder="En"></div>
                    <div class="col"><input type="text" class="form-control form-control-sm" name="renk_{{ loop.index0 }}" value="{{ item.renk or '' }}" placeholder="Renk"></div>
                    <div class="col"><input type="date" class="form-control form-control-sm" name="teslim_tarihi_{{ loop.index0 }}" value="{{ item.teslim_tarihi.strftime('%Y-%m-%d') if item.teslim_tarihi else '' }}" title="Teslim Tarihi"></div>
                </div>
                {% endfor %}
            </div>
            <button type="button" class="btn btn-success btn-sm mb-3" id="add-item">
                <i class="bi bi-plus"></i> Ürün Ekle
            </button>

            <div class="mb-3">
                <label for="notes" class="form-label">Notlar</label>
                <textarea class="form-control" id="notes" name="notes" rows="3">{{ deal.notes or '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Güncelle</button>
                <a href="{{ url_for('deal_detail', id=deal.id) }}" class="btn btn-secondary"><i class="bi bi-x-lg"></i> İptal</a>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('para_birimi').addEventListener('change', function () {
    var kurBox = document.getElementById('kullanilan_kur_box');
    var kurInput = document.getElementById('kullanilan_kur');
    if (this.value === 'TRY') {
        kurBox.style.display = 'none';
        kurInput.value = '';
    } else {
        kurBox.style.display = 'block';
        fetchTcmbRate(this.value);
    }
});

function fetchTcmbRate(currency) {
    var kurInput = document.getElementById('kullanilan_kur');
    var kurInfo = document.getElementById('tcmb_kur_info');
    kurInfo.className = 'form-text text-muted';
    kurInfo.textContent = 'TCMB kuru alınıyor...';
    fetch('/api/tcmb-rate?currency=' + encodeURIComponent(currency))
        .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
        .then(function (r) {
            if (!r.ok) {
                kurInfo.className = 'form-text text-danger';
                kurInfo.textContent = r.body.error || 'TCMB kuru alınamadı, elle girin.';
                return;
            }
            kurInput.value = r.body.rate;
            kurInfo.className = 'form-text text-success';
            kurInfo.textContent = 'TCMB güncel kuru: 1 ' + currency + ' = ' + r.body.rate + ' ₺ (gerekirse elle değiştirebilirsiniz)';
        })
        .catch(function () {
            kurInfo.className = 'form-text text-danger';
            kurInfo.textContent = 'TCMB kuru alınamadı (bağlantı hatası), elle girin.';
        });
}

document.getElementById('tcmb_fetch_btn').addEventListener('click', function () {
    fetchTcmbRate(document.getElementById('para_birimi').value);
});

let itemCount = {{ deal.items|length }};
document.getElementById('add-item').addEventListener('click', function() {
    const container = document.getElementById('items-container');
    const row = document.createElement('div');
    row.className = 'row mb-2 item-row';
    row.innerHTML = `
        <div class="col-md-3">
            <input type="text" class="form-control" name="desc_${itemCount}" placeholder="Açıklama" required>
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" name="qty_${itemCount}" placeholder="Miktar" min="0" step="0.01" required>
        </div>
        <div class="col-md-2">
            <select class="form-select" name="unit_${itemCount}">
                <option value="adet">Adet</option>
                <option value="kg">Kg</option>
                <option value="mt">Metre</option>
                <option value="lt">Litre</option>
                <option value="m2">m²</option>
            </select>
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" name="price_${itemCount}" placeholder="Birim Fiyat (₺)" min="0" step="0.01" required>
        </div>
        <div class="col-md-2">
            <select class="form-select" name="urun_tipi_${itemCount}" title="Üretim: kendi atölyemizde üretilir. Ticaret: hazır alınıp satılır.">
                <option value="uretim">Üretim</option>
                <option value="ticaret">Ticaret</option>
            </select>
        </div>
        <div class="col-md-1">
            <button type="button" class="btn btn-danger btn-sm remove-item"><i class="bi bi-trash"></i></button>
        </div>
    `;
    const specsRow = document.createElement('div');
    specsRow.className = 'row mb-2 g-1 item-specs-row';
    specsRow.innerHTML = `
        <div class="col"><input type="text" class="form-control form-control-sm" name="kagit_cinsi_${itemCount}" placeholder="Kağıt Cinsi"></div>
        <div class="col"><input type="text" class="form-control form-control-sm" name="boy_${itemCount}" placeholder="Boy"></div>
        <div class="col"><input type="text" class="form-control form-control-sm" name="en_${itemCount}" placeholder="En"></div>
        <div class="col"><input type="text" class="form-control form-control-sm" name="renk_${itemCount}" placeholder="Renk"></div>
        <div class="col"><input type="date" class="form-control form-control-sm" name="teslim_tarihi_${itemCount}" title="Teslim Tarihi"></div>
    `;
    container.appendChild(row);
    container.appendChild(specsRow);
    itemCount++;
});

document.addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-item') || e.target.closest('.remove-item')) {
        const row = e.target.closest('.item-row');
        const specsRow = row.nextElementSibling;
        if (specsRow && specsRow.classList.contains('item-specs-row')) specsRow.remove();
        row.remove();
    }
});
</script>
{% endblock %}
